[build]
  base    = "desktop"
  command = "npm ci --ignore-scripts && npm run build:web"
  publish = "dist/web"

[build.environment]
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
  NPM_FLAGS = "--ignore-scripts"

[[edge_functions]]
  function = "geo-restrict"
  path = "/*"

[[redirects]]
  from   = "/*"
  to     = "/index-web.html"
  status = 200
